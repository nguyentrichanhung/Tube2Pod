{% extends "base.html" %}
{% block title %}Cài đặt{% endblock %}
{% block content %}
<header class="page-header"><h1>Cài đặt</h1></header>

<form method="post" action="/settings" class="card settings-form">
  <input type="hidden" name="_csrf" value="{{ csrf }}">

  <section class="settings-section">
    <div class="stack">
      <h2>Chủ sở hữu</h2>
      <p class="muted">Áp dụng cho mọi show và feed.</p>
    </div>
    <div class="stack">
      <label>Tên chủ sở hữu<input name="owner_name" value="{{ settings.owner_name }}"></label>
      <label>Email chủ sở hữu<input type="email" name="owner_email" value="{{ settings.owner_email }}"></label>
    </div>
  </section>

  <section class="settings-section">
    <h2>Mặc định phát hành</h2>
    <div class="stack">
      <label class="row"><input type="checkbox" name="auto_publish_default" value="on" {% if settings.auto_publish_default %}checked{% endif %}> Tự phát hành khi feed bật</label>
      <label class="row"><input type="checkbox" name="default_explicit" value="on" {% if settings.default_explicit %}checked{% endif %}> Đánh dấu nội dung nhạy cảm</label>
      <a href="/shows">Quản lý feed của từng show</a>
    </div>
  </section>

  <section class="settings-section">
    <h2>Giới hạn nguồn</h2>
    <div class="stack">
      <label>Thời lượng tối thiểu (giây)<input type="number" name="min_source_seconds" min="10" max="600" value="{{ settings.min_source_seconds }}" required></label>
      <label>Thời lượng tối đa (phút)<input type="number" name="max_source_minutes" min="30" max="600" value="{{ settings.max_source_minutes }}" required></label>
    </div>
  </section>

  <div class="settings-actions">
    <button class="btn" type="submit">Lưu cài đặt</button>
  </div>
</form>
{% endblock %}
