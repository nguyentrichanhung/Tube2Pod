{% extends "base.html" %}
{% block content %}
<h1>Chọn bản audio</h1>
<form class="card stack" data-audio-selection method="post" action="/episodes/{{ uuid }}/retry">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  {{ preview|safe }}
  <button class="btn" type="submit">Xác nhận và thử lại</button>
</form>
{% include "partials/audio_selection_script.html" %}
{% endblock %}
