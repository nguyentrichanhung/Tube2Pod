<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thiết lập Tube2Pod</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #f2f2e9; color: #1d3029; font: 16px/1.55 system-ui, sans-serif }
    main { max-width: 1080px; margin: auto; padding: clamp(20px,5vw,72px) 24px }
    .brand, .actions, .row { display: flex; align-items: center; gap: 12px }
    .row { justify-content: space-between; border-bottom: 1px solid #d6ddd4; padding: 9px 0; font-size: 15px }
    .row small { font-family: ui-monospace, monospace; color: #58685e }
    .brand { font-size: 19px; font-weight: 650 }
    .mark, .wave { display: flex; align-items: center; gap: 3px }
    .mark i, .wave i { width: 3px; height: 12px; background: currentColor; border-radius: 2px }
    .mark i:nth-child(2) { height: 24px }
    .mark i:nth-child(3) { height: 18px }
    button { font: inherit; border-radius: 6px; min-height: 44px; padding: 10px 22px; background: #214f3d; color: white; border: 1px solid transparent; cursor: pointer; font-weight: 600 }
    button:hover { background: #143c2b }
    button:active { transform: translateY(1px) }
    :focus-visible { outline: 3px solid #bc5c16; outline-offset: 3px }
    .window { border: 1px solid #b5bfb3; border-radius: 14px; overflow: hidden; background: #fdfdf8; display: grid; grid-template-columns: minmax(200px,32%) 1fr; box-shadow: 0 14px 42px #1b332414 }
    aside { background: #183e32; color: #e7f4e8; display: flex; flex-direction: column; justify-content: space-between; padding: 32px; gap: 32px }
    .wave { height: 90px; gap: 4px; color: #9acab2; align-self: stretch }
    .wave i { flex: 1; max-width: 4px }
    .platform { display: block; font-size: 14px; color: #c4dacb }
    article { min-width: 0; padding: clamp(24px,5vw,56px); display: flex; flex-direction: column; min-height: 418px }
    h1 { font-size: clamp(26px,3.2vw,38px); line-height: 1.14; letter-spacing: -.035em; font-weight: 600; margin: 0 0 15px }
    p { color: #4e6056; margin: 0 0 24px; max-width: 50ch }
    ul { list-style: none; margin: 0 0 28px; padding: 0 }
    .actions { margin-top: auto }
    progress { width: 100%; height: 9px; accent-color: #357450; margin-bottom: 14px }
    .error { color: #934223 }
    [hidden] { display: none !important }
    @media (max-width: 650px) {
      main { padding: 18px 16px }
      .window { display: block }
      aside { padding: 16px 22px; flex-direction: row; align-items: center }
      .wave { display: none }
      article { min-height: 365px }
      .row { flex-wrap: wrap }
      .actions button { width: 100% }
    }
  </style>
</head>
<body>
<main>
  <section class="window" aria-label="Thiết lập Tube2Pod">
    <aside>
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Tube2Pod</div>
      <div class="wave" aria-hidden="true"></div>
      <span id="platform" class="platform"></span>
    </aside>
    <article>
      <div aria-live="polite"><h1 id="title"></h1><p id="copy"></p></div>
      <progress id="progress" aria-label="Tiến độ tải công cụ"></progress>
      <ul id="tools"></ul>
      <div class="actions"><button id="act"></button></div>
    </article>
  </section>
</main>
<script>
const headers = { 'x-desktop-token': location.hash.slice(1) };
const names = ['Lấy âm thanh từ video', 'Chuyển âm thanh sang MP3', 'Đọc thời lượng tập'];
const binaries = ['yt-dlp', 'ffmpeg', 'ffprobe'];
const scenarios = {
  prepare: ['Cài đặt Tube2Pod', 'Tạo podcast từ âm thanh của video YouTube trên máy của bạn. Hãy kết nối Internet để tải ba công cụ cho lần cài đầu tiên.', 'Cài đặt'],
  loading: ['Đang tải công cụ', 'Tube2Pod đang tải công cụ cần thiết.', ''],
  full: ['Máy thiếu chỗ trống', 'Giải phóng dung lượng trên ổ cài đặt rồi bấm Thử lại.', 'Thử lại'],
  error: ['Tải xuống bị gián đoạn', 'Kiểm tra kết nối Internet hoặc dung lượng trống rồi bấm Thử lại. Công cụ đã tải xong sẽ được giữ lại.', 'Thử lại'],
  ready: ['Tube2Pod đã sẵn sàng', 'Bấm Mở Tube2Pod để vào trang quản trị trong trình duyệt.', 'Mở Tube2Pod'],
  starting: ['Đang mở Tube2Pod', 'Vui lòng chờ máy chủ sẵn sàng.', ''],
  running: ['Tube2Pod đang chạy', 'Đóng tab vẫn cho phép máy tiếp tục phục vụ podcast.', 'Dừng Tube2Pod']
};
const title = document.querySelector('#title');
const copy = document.querySelector('#copy');
const act = document.querySelector('#act');
const progress = document.querySelector('#progress');
const tools = document.querySelector('#tools');
document.querySelector('#platform').textContent = 'PLATFORM_LABEL';
[8,15,10,23,35,21,32,54,69,48,35,64,86,55,38,58,44,29,18,32,22,14,25,12,7].forEach(height => {
  const bar = document.createElement('i');
  bar.style.height = height + '%';
  document.querySelector('.wave').append(bar);
});
async function update() {
  try {
    const response = await fetch('/status', { headers });
    if (!response.ok) throw Error();
    const { status, detail, active: activeTool } = await response.json();
    const [heading, description, button] = scenarios[status];
    title.textContent = heading;
    copy.textContent = description + (detail ? ' ' + detail : '');
    title.classList.toggle('error', status === 'error' || status === 'full');
    progress.hidden = status !== 'loading';
    act.hidden = !button;
    act.textContent = button;
    tools.replaceChildren();
    const active = binaries.findIndex(name => activeTool.startsWith(name));
    names.forEach((name, i) => {
      const li = document.createElement('li');
      const small = document.createElement('small');
      li.className = 'row';
      li.append(name);
      small.textContent = status === 'ready' || status === 'starting' || status === 'running' ? 'Sẵn sàng'
        : active < 0 ? binaries[i]
        : i < active ? 'Đã tải'
        : i === active ? (status === 'loading' ? 'Đang tải' : 'Tạm dừng') : 'Đang chờ';
      li.append(small);
      tools.append(li);
    });
  } catch {
    title.textContent = 'Không thể kết nối Tube2Pod';
    act.hidden = true;
  }
  setTimeout(update, 1000);
}
act.onclick = async () => {
  act.disabled = true;
  try { await fetch('/action', { method: 'POST', headers }); }
  finally { act.disabled = false; }
};
update();
</script>
</body>
</html>
