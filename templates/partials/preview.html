<div class="preview-layout">
  <div class="stack"><h3>{{ title }}</h3>
  {% if !channel.is_empty() %}<p class="muted">{{ channel }}</p>{% endif %}
  <p class="muted">Thời lượng: {{ duration }}</p>
  {% if has_thumbnail %}<a href="{{ thumbnail }}" target="_blank" rel="noopener noreferrer">Ảnh thu nhỏ</a>{% endif %}
  </div><div class="stack"><input type="hidden" name="preview_video" value="{{ video_id }}">
  <fieldset class="stack">
    <legend>Bản audio</legend>
    {% for track in tracks %}
    <label class="audio-track"><input type="radio" name="source_audio_track" value="{{ track.key }}" {% if track.selected %}checked{% endif %} required>
      {% if track.default %}Bản mặc định{% else if track.recommended %}Đề xuất{% else %}Bản audio đi kèm {{ loop.index0 }}{% endif %}
      {% if track.original %} · Bản gốc{% endif %}{% if loop.first %} · {{ track.language }}{% endif %}
    </label>
    {% endfor %}
  </fieldset>
  {% if tracks.len() > 1 %}
  <label>Ngôn ngữ bản đi kèm
    <select name="language" disabled>
      <option value="und" {% if language == "und" %}selected{% endif %}>Chưa rõ ngôn ngữ</option>
      <option value="vi" {% if language == "vi" %}selected{% endif %}>Tiếng Việt</option>
      <option value="en" {% if language == "en" %}selected{% endif %}>Tiếng Anh</option>
      <option value="ko" {% if language == "ko" %}selected{% endif %}>Tiếng Hàn</option>
    </select>
  </label>
  {% endif %}
  </div>
</div>
