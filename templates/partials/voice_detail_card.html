<div class="row between">
  <span class="badge{% if voice.status == "ready" %} badge-ok{% else if voice.status == "failed" %} badge-err{% endif %}">
    {% if voice.status == "ready" %}Sẵn sàng{% else if voice.status == "measuring" %}Đang đo giọng…{% else if voice.status == "failed" %}Lỗi{% else %}Đang xử lý{% endif %}
  </span>
  {% if voice.status == "ready" %}
  <button type="button" class="voice-preview-button"
          data-preview-url="/voices/{{ voice.id }}/preview"
          data-voice-name="{{ voice.name.as_deref().unwrap_or("Giọng đọc") }}">Nghe thử</button>
  {% endif %}
</div>
<div class="voice-preview-bar">
  <span class="voice-preview-label">Chọn “Nghe thử” để nghe giọng.</span>
  <audio controls preload="none" aria-label="Nghe thử giọng đọc"></audio>
</div>
