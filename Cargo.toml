[package]
name = "tube2pod"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
askama = "0.12"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = "0.25"
mime_guess = "2"
quick-xml = "0.37"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
whatlang = "0.16"

[dev-dependencies]
http-body-util = "0.1"
quickcheck = "1"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = "symbols"
