[package]
name = "tube2pod"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
default-run = "tube2pod"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
askama = "0.12"
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-ring"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.25", default-features = false }
if-addrs = "0.15"
mdns-sd = "0.22.0"
mime_guess = "2"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
rcgen = { version = "=0.13.2", features = ["pem"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4"
xz2 = "0.1"

[dev-dependencies]
http-body-util = "0.1"
quickcheck = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
